<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        h1 {
            font-size: 5rem;
            color: #dc3545;
        }

        p {
            font-size: 1.5rem;
        }

        a {
            text-decoration: none;
            color: #007bff;
            font-size: 1.2rem;
            border: 1px solid #007bff;
            padding: 10px 20px;
            border-radius: 5px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        a:hover {
            background-color: #007bff;
            color: white;
        }

        .container {
            text-align: center;
        }

        .image-404 {
            width: 100px;
            height: 100px;
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="https://img.icons8.com/clouds/100/000000/error.png" alt="Error Icon" class="image-404">
        <h1>404</h1>
        <p>Oops! The page you're looking for cannot be found.</p>
    </div>
</body>

</html>
