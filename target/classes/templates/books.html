<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>VBookStore</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"></script>
</head>

<body>
    <div class="container-fluid">
        <nav class="navbar navbar-expand-sm navbar-light bg-light fixed-top">
            <a class="navbar-brand">VBookStore</a>
        </nav>

        <div class="row"
            style="margin-bottom: 10px; margin-right: 10px; margin-left: 10px; margin-top: 80px; text-align: center; background-color: lightgray;">

            <!-- Field for searching books -->
            <div class="col-4 d-flex justify-content-center align-items-center">
                <form class="w-100 p-3" th:action="@{/search}" method="get">

                    <!-- Name -->
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" class="form-control" id="name" name="name" th:value="${name}"
                            placeholder="Name">
                    </div>

                    <!-- Author -->
                    <div class="form-group">
                        <label for="author">Author</label>
                        <input type="text" class="form-control" id="author" name="author" th:value="${author}"
                            placeholder="Author">
                    </div>

                    <!-- Year (Min and Max) -->
                    <div class="form-row">
                        <label for="year" class="text-center w-100">Years</label>
                    </div>
                    <div class="form-row">
                        <div class="form-group col">
                            <input type="number" class="form-control" id="minYear" name="minYear" th:value="${minYear}"
                                placeholder="Min">
                        </div>
                        <div class="form-group col">
                            <input type="number" class="form-control" id="maxYear" name="maxYear" th:value="${maxYear}"
                                placeholder="Max">
                        </div>
                    </div>

                    <!-- Price (Min and Max) -->
                    <div class="form-row">
                        <label for="price" class="text-center w-100">Price</label>
                    </div>
                    <div class="form-row">
                        <div class="form-group col">
                            <input type="number" step="0.01" class="form-control" id="minPrice" name="minPrice"
                                th:value="${minPrice}" placeholder="Min">
                        </div>
                        <div class="form-group col">
                            <input type="number" step="0.01" class="form-control" id="maxPrice" name="maxPrice"
                                th:value="${maxPrice}" placeholder="Max">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary mt-3">Search</button>
                </form>
            </div>

            <!-- Output of found books in the form of a simple table -->
            <div class="col-8 d-flex justify-content-center align-items-center flex-column">
                <h2>Search results</h2>
                <table class="table table-striped table-hover mt-3">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Author</th>
                            <th>Year</th>
                            <th>Price</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="book : ${books}">
                            <td th:text="${book.name}"></td>
                            <td th:text="${book.author}"></td>
                            <td th:text="${book.year}"></td>
                            <td th:text="${book.price}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
