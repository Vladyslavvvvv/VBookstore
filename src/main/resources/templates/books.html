<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>VBookStore</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"></script>

    <style>
        /* Disabling the scrollbar for WebKit-based browsers (Chrome, Safari, Edge) */
        .content-table-wrapper::-webkit-scrollbar {
            width: 0;
            height: 0;
        }

        /* Disable scrollbar for Firefox */
        .content-table-wrapper {
            scrollbar-width: none;
        }

        /* Fixed width of tables */
        .header-table,
        .content-table {
            table-layout: fixed;
            width: 95%;
        }

        /* Fixed width of each column */
        .header-table th,
        .content-table td {
            width: 25%; /* Fixed width of each column (25% for 4 columns) */
        }

        .header-table th {
            background-color: lightgray;
            border-bottom: 2px solid #dee2e6;
            padding: 8px;
            text-align: left;
        }

        .content-table-wrapper {
            max-height: 350px; /* the height of the scrolling area */
            overflow-y: auto; /* vertical scrolling */
            display: block;
        }

        .content-table td {
            padding: 8px;
            border-bottom: 1px solid #dee2e6;
        }

        .content-table tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .content-table tr:hover {
            background-color: #ddd;
        }

        /* Form and table alignment */
        .form-content-wrapper {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
        }

        .table-container {
            flex-grow: 1;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <nav class="navbar navbar-expand-sm navbar-light bg-light fixed-top">
            <a class="navbar-brand">VBookStore</a>
        </nav>

        <div class="row" style="margin: 80px 10px 10px 10px; text-align: center; background-color: lightgray;">
            <div class="form-content-wrapper">
                <!-- Field for searching books -->
                <div class="col-4">
                    <form class="w-100 p-3" th:action="@{/search}" method="get">
                        <!-- Name -->
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" class="form-control" id="name" name="name" th:value="${name}"
                                placeholder="Name">
                        </div>

                        <!-- Author -->
                        <div class="form-group">
                            <label for="author">Author</label>
                            <input type="text" class="form-control" id="author" name="author" th:value="${author}"
                                placeholder="Author">
                        </div>

                        <!-- Year (Min and Max) -->
                        <div class="form-row">
                            <label for="year" class="text-center w-100">Years</label>
                        </div>
                        <div class="form-row">
                            <div class="form-group col">
                                <input type="text" class="form-control" id="minYear" name="minYear"
                                    th:value="${minYear}" placeholder="Min">
                            </div>
                            <div class="form-group col">
                                <input type="text" class="form-control" id="maxYear" name="maxYear"
                                    th:value="${maxYear}" placeholder="Max">
                            </div>
                        </div>

                        <!-- Price (Min and Max) -->
                        <div class="form-row">
                            <label for="price" class="text-center w-100">Price</label>
                        </div>
                        <div class="form-row">
                            <div class="form-group col">
                                <input type="text" step="0.01" class="form-control" id="minPrice" name="minPrice"
                                    th:value="${minPrice}" placeholder="Min">
                            </div>
                            <div class="form-group col">
                                <input type="text" step="0.01" class="form-control" id="maxPrice" name="maxPrice"
                                    th:value="${maxPrice}" placeholder="Max">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary mt-3">Search</button>
                    </form>
                </div>

                <!-- Output of search results -->
                <div class="col-8 table-container">
                    <!-- Table for headings -->
                    <table class="header-table" style="margin-top: 10px;">
                        <thead>
                            <tr>
                                <th style="text-align: center;">Name</th>
                                <th style="text-align: center;">Author</th>
                                <th style="text-align: center;">Year</th>
                                <th style="text-align: center;">Price</th>
                            </tr>
                        </thead>
                    </table>

                    <!-- Scrollable table of contents -->
                    <div class="content-table-wrapper">
                        <table class="content-table">
                            <tbody>
                                <tr th:each="book : ${books}">
                                    <td th:text="${book.name}"></td>
                                    <td th:text="${book.author}"></td>
                                    <td th:text="${book.year}"></td>
                                    <td th:text="${book.price}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>
</body>

</html>
